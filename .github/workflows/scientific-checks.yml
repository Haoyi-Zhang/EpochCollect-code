name: Bounded scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Tests, replay and clean finite reproduction
        shell: bash
        run: |
          mkdir -p scientific-output
          set -o pipefail
          ulimit -v 3145728
          timeout --signal=TERM --kill-after=10s 900s \
            python -B reproduce_all.py --full \
              --output-dir scientific-output/recomputed \
              --seconds 20 --max-chunks 20 \
            2>&1 | tee scientific-output/whole-run.log
      - name: Independent finite checker-index regressions
        shell: bash
        run: |
          set -o pipefail
          ulimit -v 3145728
          timeout --signal=TERM --kill-after=10s 30s \
            python -B tests/checker_index_regression.py \
            2>&1 | tee scientific-output/checker-index-regression.log
      - name: Retain the exact isolated raw-output directory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-output
          path: scientific-output
          if-no-files-found: warn
          retention-days: 7
